<!DOCTYPE html>
<html>
<head>
 <title>Background Color using CSS</title>
 <style>
 body {
 background-color: lightgray;
 font-family: Arial;
 }
 h1 {
 background-color: darkblue;
 color: white;
 text-align: center;
 padding: 20px;
 }
 .box1 {
 background-color: lightblue;
 padding: 20px;
 margin: 20px;
 border: 2px solid blue;
 }
 .box2 {
 background-color: lightgreen;
 padding: 20px;
 margin: 20px;
 border: 2px solid green;
 }
 .box3 {
 background-color: lightyellow;
 padding: 20px;
 margin: 20px;
 border: 2px solid orange;
 }
 button {
 background-color: purple;
 color: white;
 padding: 10px 20px;
 border: none;
 margin: 10px;
 }
 </style>
</head>
<body>
 <h1>Changing Background Colors Using CSS</h1>
 <div class="box1">
 <h2>Light Blue Background</h2>
 <p>This section has a light blue background color.</p>
 </div>
 <div class="box2">
 <h2>Light Green Background</h2>
 <p>This section has a light green background color.</p>
 </div>
 <div class="box3">
 <h2>Light Yellow Background</h2>
 <p>This section has a light yellow background color.</p>
 </div>
 <div style="text-align:center;">
 <button>Submit</button>
 <button>Reset</button>
 </div>
</body>
</html>
