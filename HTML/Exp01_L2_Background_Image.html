<!DOCTYPE html>
<html>
<head>
    <title>Body Background Attribute</title>
</head>
<body background="university.webp">
<style>
        body {
            background-repeat: no-repeat;  background-position:  center;
           background-size: 500px 500px;
           /* background-size: cover; */  /* TRY one another by removing comments */
            background-attachment: fixed;
        }
</style>
    <h1>Background Image Demo</h1>
    <p>
        This page uses the HTML body background attribute
        to display an image as the background.
    </p>
</body>
</html>
