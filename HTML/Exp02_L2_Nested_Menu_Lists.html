<!DOCTYPE html>
<html>
<head>
    <title>Product Categories - Nested List</title>
</head>
<body bgcolor="pink">
    <h2>Online Shopping Product Categories</h2>
    <!-- Main Ordered List -->
    <ol type="1">
        <li>Electronics</li>
        <li>Mobile Phones
            <!-- Sublist -->
            <ol type="A">
                <li>Apple iPhone</li>
                <li>Samsung Galaxy
                    <!-- Sub-Sublist -->
                    <ol type="i">
                        <li>Galaxy S Series</li>
                        <li>Galaxy A Series</li>
                    </ol>
                </li>
            </ol>
        </li>
    </ol>
    <h4>Available Products:</h4>
    <!-- Main Unordered List -->
    <ul>
        <li>Laptops</li>
        <li>Headphones
            <!-- Nested Unordered List -->
            <ul>
                <li>Wireless Headphones</li>
                <li>Bluetooth Earphones</li>
            </ul>
        </li>
        <li>Smart Watches</li>
    </ul>
</body>
</html>
